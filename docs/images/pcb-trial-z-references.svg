<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
<rect width="1440" height="760" fill="#f7f9fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#20374b">
<text x="40" y="46" font-size="27" font-weight="bold">PCB trial: three deliberate surface references</text>
<text x="40" y="76" font-size="18">Schematic sections — layer thicknesses exaggerated. Jig XY stays fixed throughout.</text>
<g transform="translate(40,110)">
<rect width="425" height="480" rx="12" fill="white" stroke="#c9d3de"/>
<text x="20" y="36" font-size="22" font-weight="bold">10 → coat/cure → 20</text>
<text x="20" y="66" font-size="18">Keep bond, copper zero AND map</text>
<rect x="35" y="165" width="350" height="22" fill="#f1f0de"/>
<rect x="35" y="187" width="350" height="28" fill="#327b54"/>
<rect x="35" y="215" width="350" height="10" fill="#bc8439"/>
<rect x="35" y="225" width="350" height="90" fill="#dfce9e"/>
<rect x="35" y="315" width="350" height="13" fill="#8ab1ce"/>
<rect x="35" y="328" width="350" height="45" fill="#b9c1c8"/>
<path d="M20 215 H400" stroke="#c14b43" stroke-width="2" stroke-dasharray="7 5"/>
<text x="48" y="149" font-size="17">Contrasting outer mask / base mask</text>
<text x="55" y="255" font-size="18">Copper Z0 retained under coating</text>
<text x="65" y="290" font-size="18">1.5 mm PCB substrate</text>
<text x="50" y="350" font-size="16">Same bonded seating on jig</text>
<text x="20" y="412" font-size="18">NO surface probing or remapping.</text>
<text x="20" y="439" font-size="18">Tool-length setting only.</text>
<text x="20" y="466" font-size="18">Initial pad overtravel: 0.05 mm.</text>
</g>
<g transform="translate(505,110)">
<rect width="425" height="480" rx="12" fill="white" stroke="#c9d3de"/>
<text x="20" y="36" font-size="22" font-weight="bold">25 bottom / 40 top legend</text>
<text x="20" y="66" font-size="18">NEW zero at finished outer mask</text>
<rect x="35" y="165" width="350" height="22" fill="#f1f0de"/>
<rect x="35" y="187" width="350" height="28" fill="#327b54"/>
<rect x="35" y="215" width="350" height="100" fill="#dfce9e"/>
<path d="M20 165 H400" stroke="#c14b43" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M185 100 V145 L200 180 L215 145 V100" fill="#a8c0d7" stroke="#20374b" stroke-width="2"/>
<text x="45" y="245" font-size="18">Reveal base color; retain base mask</text>
<text x="45" y="280" font-size="18">Copper map disabled</text>
<text x="45" y="308" font-size="18">Diamond drag: spindle OFF</text>
<text x="20" y="385" font-size="18">Initial spring preload: 0.05 mm.</text>
<text x="20" y="412" font-size="18">Use manual/mechanical first contact:</text>
<text x="20" y="439" font-size="18">diamond is not an electrical probe.</text>
<text x="20" y="466" font-size="18">Bottom and top repeat offsets separate.</text>
</g>
<g transform="translate(970,110)">
<rect width="425" height="480" rx="12" fill="white" stroke="#c9d3de"/>
<text x="20" y="36" font-size="22" font-weight="bold">50 final holes, bottom up</text>
<text x="20" y="66" font-size="18">NEW zero at aluminium jig floor</text>
<rect x="35" y="155" width="350" height="100" fill="#dfce9e"/>
<rect x="35" y="255" width="350" height="65" fill="#c6a080"/>
<rect x="35" y="320" width="350" height="53" fill="#b9c1c8"/>
<path d="M340 128 V265 H355 V128" fill="white" stroke="#20374b" stroke-width="2"/>
<path d="M20 320 H400" stroke="#c14b43" stroke-width="2" stroke-dasharray="7 5"/>
<text x="48" y="145" font-size="17">Modeled copper plane +2.50 mm</text>
<text x="48" y="240" font-size="17">PCB underside +1.00 mm</text>
<text x="48" y="288" font-size="17">Sacrificial backing</text>
<text x="48" y="347" font-size="18">Aluminium floor = Z0</text>
<text x="20" y="402" font-size="18">Final tool tip +0.85 mm: above floor.</text>
<text x="20" y="429" font-size="18">No copper map. Never below zero.</text>
<text x="20" y="456" font-size="18">Dimensions are selected CAM defaults.</text>
</g>
<rect x="40" y="622" width="1355" height="100" rx="10" fill="#e4edf4"/>
<text x="62" y="653" font-size="21" font-weight="bold">Pad clearing and drag engraving: start light → clean / inspect → lower operation offset slightly → repeat if needed</text>
<text x="62" y="684" font-size="19">Keep the saved surface datum. A lower operation offset increases spring pressure; it is not a measured removal depth.</text>
<text x="62" y="710" font-size="18">Coating and curing stay in the jig. Only the intentional flip and final backing setup require releasing and remounting the board.</text>
</g></svg>
